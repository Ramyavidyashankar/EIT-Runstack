            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # Lambda permission for GET /synthetic/{syntheticJobId}
  rApiGatewaySqsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SQSSendMessagePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt rCsaNotificationQueue.Arn

  # Dead Letter Queue
  rCsaNotificationDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${pSolutionName}-notification-dlq'
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600  # 14 days

  # Main SQS Queue
  rCsaNotificationQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${pSolutionName}-notification-queue'
      KmsMasterKeyId: alias/aws/sqs
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt rCsaNotificationDlq.Arn
        maxReceiveCount: 3

  # CloudWatch Alarm for DLQ
  rCsaDlqCwAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: The solution requires a static name for this resource
    Properties:
      AlarmName: !Sub '${pSolutionName}-dlq-cw-alarm'
      AlarmDescription: Alarm when messages are in the DLQ
      MetricName: ApproximateNumberOfVisibleMessages
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt rCsaNotificationDlq.QueueName
      AlarmActions:
        - !Ref rCsaNotificationTopic

  # DynamoDB Table
  rCsaJobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: The solution requires a static name for this resource
    Properties:
      TableName: !Sub '${pSolutionName}-jobs-table'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: notification_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: notification-id-index
          KeySchema:
            - AttributeName: notification_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

# ========================================================================
# REMOVED: Security Groups and VPC Endpoints
# These resources are now pre-configured by the network team
# References changed to use parameters: pExistingLambdaSecurityGroupId and pExistingEndpointSecurityGroupId
# ========================================================================

  # ── Pre Token Generation Lambda ───────────────────────────────────────────────
  # IMPORTANT: This Lambda intentionally has NO VpcConfig.
  # Cognito Pre Token Generation triggers invoke Lambda synchronously and cannot
  # reach functions in private subnets without a Cognito VPC endpoint.
  # All other Lambdas in this stack are in VPC — this one must remain public.
  rCsaPreTokenFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: The solution requires a static name for this resource
          - id: W11
            reason: This role needs cognito-idp access for group lookup
    Properties:
      FunctionName: !Sub '${pSolutionName}-pre-token'
      CodeUri: src/pre_token/
      Handler: app.lambda_handler
      # No VpcConfig — Cognito cannot invoke VPC Lambdas without Cognito VPC endpoint
      Environment:
        Variables:
          APP_ACCESS_TABLE: !Ref rCsaAppAccessTable
          USER_ROLES_TABLE: !Ref rCsaUserRolesTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminListGroupsForUser
              # Using Sub instead of !GetAtt rCsaCognitoUserPool.Arn to avoid
              # circular dependency: UserPool→PreTokenFunction→UserPool
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
            # Consolidated: same action set / resource pattern as
            # rCsaProcessMessages, so any new runstack-* table (or new
            # action need on an existing one) needs no IAM change here.
            - Sid: RunStackDynamoDBAllTables
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
                - dynamodb:DescribeTable
                - dynamodb:ConditionCheckItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/runstack-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/runstack-*/index/*'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'

  # Cognito permission to invoke Pre Token Lambda
  rCsaPreTokenFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt rCsaPreTokenFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt rCsaCognitoUserPool.Arn

  # IAM Role for the attach trigger custom resource Lambda
  rCsaAttachPreTokenTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${pSolutionName}-attach-pretoken-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AttachPreTokenPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:UpdateUserPool
                Resource: !GetAtt rCsaCognitoUserPool.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # Custom Resource Lambda to attach Pre Token trigger to UserPool
  # Uses AWS::Lambda::Function (not SAM) because InlineCode requires it
  rCsaAttachPreTokenTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${pSolutionName}-attach-pretoken-trigger'
      Runtime: python3.12
      Timeout: 30
      Role: !GetAtt rCsaAttachPreTokenTriggerRole.Arn
      Handler: index.handler
      Code:
        ZipFile: |
          import boto3, json
          import cfnresponse
          def handler(event, context):
            try:
              client = boto3.client('cognito-idp')
              user_pool_id = event['ResourceProperties']['UserPoolId']
              lambda_arn = event['ResourceProperties']['LambdaArn']
              if event['RequestType'] in ('Create', 'Update'):
                pool = client.describe_user_pool(UserPoolId=user_pool_id)['UserPool']
                triggers = pool.get('LambdaConfig', {})
                triggers['PreTokenGeneration'] = lambda_arn
                client.update_user_pool(UserPoolId=user_pool_id, LambdaConfig=triggers)
              elif event['RequestType'] == 'Delete':
                pool = client.describe_user_pool(UserPoolId=user_pool_id)['UserPool']
                triggers = pool.get('LambdaConfig', {})
                triggers.pop('PreTokenGeneration', None)
                client.update_user_pool(UserPoolId=user_pool_id, LambdaConfig=triggers)
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
            except Exception as e:
              print(str(e))
              cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  rCsaAttachPreTokenTrigger:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - rCsaPreTokenFunctionPermission
    Properties:
      ServiceToken: !GetAtt rCsaAttachPreTokenTriggerFunction.Arn
      UserPoolId: !Ref rCsaCognitoUserPool
      LambdaArn: !GetAtt rCsaPreTokenFunction.Arn

  # Lambda function to process SQS messages
  rCsaProcessMessages:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: The solution requires a static name for this resource
          - id: W11
            reason: This role needs to be able to access any resource
    Properties:
      FunctionName: !Sub '${pSolutionName}-process-messages'
      CodeUri: src/process_messages/
      Handler: app.lambda_handler
      ReservedConcurrentExecutions: !Ref pLambdaConcurrency
      VpcConfig:
        SecurityGroupIds:
          - !Ref pExistingLambdaSecurityGroupId
        SubnetIds: !Ref pPrivateSubnetIds
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref rCsaJobsTable
          QUEUE_URL: !Ref rCsaNotificationQueue
          SOLUTION_NAME: !Ref pSolutionName
          APP_ACCESS_TABLE: !Ref rCsaAppAccessTable
          USER_ROLES_TABLE: !Ref rCsaUserRolesTable
          INSTANCE_CATALOG_TABLE: !Ref rCsaInstanceCatalogTable
          DLQ_URL: !Ref rCsaNotificationDlq
          COGNITO_DOMAIN: !Sub 'https://${rCsaCognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
          COGNITO_CLIENT_ID: !Ref rCsaCognitoPublicUserPoolClient
          COGNITO_REDIRECT_URI: !Sub 'https://${rCsaApi}.execute-api.${AWS::Region}.amazonaws.com/${pStage}/auth/callback'
          CROSS_ACCOUNT_ROLE_NAME: !Ref pCrossAccountRoleName
          UPLOADS_S3_BUCKET: !Ref rCsaSchedulerBucket
          UPLOADS_S3_PREFIX: uploads/
          UPLOADS_PRESIGN_EXPIRY: '300'
          UPLOADS_MAX_BYTES: '104857600'
          COGNITO_USER_POOL_ID: !Ref rCsaCognitoUserPool
          UI_LOGINS_TABLE: !Ref rCsaUiLoginsTable
          UI_SESSION_SECRET: !Ref pUiSessionSecret
          UI_SESSION_TTL_SECONDS: '28800'
          DYNATRACE_API_URL: !Ref pDynatraceApiUrl
          DYNATRACE_FETCH_TOKEN_SECRET_ARN: !If [cCreateDynatraceFetchSecret, !Ref rDynatraceFetchApiToken, !Ref pExistingDynatraceFetchSecretArn]
          DYNATRACE_TRIGGER_TOKEN_SECRET_ARN: !If [cCreateDynatraceTriggerSecret, !Ref rDynatraceTriggerApiToken, !Ref pExistingDynatraceTriggerSecretArn]
          DYNATRACE_SYNTHETIC_FETCH_TOKEN_SECRET_ARN: !If [cCreateDynatraceSyntheticFetchSecret, !Ref rDynatraceSyntheticFetchApiToken, !Ref pExistingDynatraceSyntheticFetchSecretArn]
          DYNATRACE_CATALOG_S3_KEY: app-catalogs/dynatrace-monitor-catalog.csv
          TIDAL_AGENT_MAPPING_TABLE: !Ref rCsaTidalAgentMappingTable
          HEALTHCHECK_DOCUMENT_NAME: !Ref pHealthcheckDocumentName
          SHAREPOINT_APP_SECRET_ARN: !Ref pSharePointAppSecretArn
          DR_RUN_LOG_TABLE: !Ref rCsaDrRunLogTable
          DR_TOKENS_TABLE: !Ref rCsaDrTokensTable
          GDBA_ACCESS_TABLE: !Ref rCsaGdbaAccessTable
          TEAM_CAPABILITIES_TABLE: !Ref rCsaTeamCapabilitiesTable
          # Same thresholds for every AG — deploy-time parameters, not a
          # per-AG DynamoDB table. See pDrMaxLogQueueKB etc. in Parameters.
          DR_MAX_LOG_QUEUE_KB: !Ref pDrMaxLogQueueKB
          DR_MAX_TXN_MINUTES: !Ref pDrMaxTxnMinutes
          DR_CONFIRM_TIMEOUT_SEC: !Ref pDrConfirmTimeoutSec
          DR_POLL_INTERVAL_SEC: !Ref pDrPollIntervalSec
          DR_REPLICA_OVERRIDES_JSON: !Ref pDrReplicaOverridesJson
          DR_TEST_SQL_CREDENTIALS_SECRET_ARN: !If [cCreateDrTestSqlCredentialsSecret, !Ref rDrTestSqlCredentials, !Ref pExistingDrTestSqlCredentialsSecretArn]
          TEAMS_APPROVE_SHARED_SECRET_SECRET_ARN: !If [cCreateTeamsApproveSharedSecret, !Ref rTeamsApproveSharedSecret, !Ref pExistingTeamsApproveSharedSecretArn]
          TEAMS_DR_APPROVAL_WEBHOOK_URL_SECRET_ARN: !If [cCreateTeamsDrApprovalWebhookUrlSecret, !Ref rTeamsDrApprovalWebhookUrl, !Ref pExistingTeamsDrApprovalWebhookUrlSecretArn]
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt rCsaNotificationQueue.Arn
            BatchSize: 10
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
                - ec2:AssignPrivateIpAddresses
                - ec2:UnassignPrivateIpAddresses
              Resource: '*'
        - Version: '2012-10-17'
          Statement:
            # ============================================================
            # CONSOLIDATED: full CRUD on every runstack-* table + its GSIs,
            # one statement. Any new table (and any new capability needed
            # on an existing one, including InstanceCatalog/UiLogins) is
            # covered automatically — no IAM edit or ServiceNow ticket
            # needed when tables are added. Replaces the 7 individual
            # DynamoDBCrudPolicy/ReadPolicy/WritePolicy entries plus the
            # AppAccess/InstanceCatalog/UserRoles/UiLogins statements this
            # Lambda used to carry.
            # ============================================================
            - Sid: RunStackDynamoDBAllTables
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
                - dynamodb:DescribeTable
                - dynamodb:ConditionCheckItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/runstack-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/runstack-*/index/*'
        - Version: '2012-10-17'
          Statement:
            # Added to match production — used for the admin cognito-groups
            # lookup endpoints (list groups / members of a group).
            - Sid: RunStackListCognitoGroups
              Effect: Allow
              Action:
                - cognito-idp:ListGroups
                - cognito-idp:ListUsersInGroup
              Resource: !GetAtt rCsaCognitoUserPool.Arn
        - Version: '2012-10-17'
          Statement:
            - Sid: RunStackBatchHealthcheckSsm
              Effect: Allow
              Action:
                - ssm:SendCommand
                - ssm:GetCommandInvocation
              Resource: '*'
            # NOTE: SharePoint client_secret is currently hardcoded in app.py
            # for local testing (SHAREPOINT_CLIENT_SECRET_HARDCODED). Once the
            # real Secrets Manager secret exists, set pSharePointAppSecretArn
            # to its ARN and add back:
            #   - Sid: RunStackSharePointSecretRead
            #     Effect: Allow
            #     Action:
            #       - secretsmanager:GetSecretValue
            #     Resource: !Ref pSharePointAppSecretArn
            # ^ done — runstack-sharepoint-app-secret now exists. Wrapped in
            # Fn::If (rather than an unconditional statement) so this is
            # omitted entirely when pSharePointAppSecretArn is blank, instead
            # of being included with Resource: "" — an invalid empty ARN that
            # sat unnoticed in the live IAM policy until CloudFormation's
            # newer early-validation hook started flagging it.
            - !If
              - cSharePointSecretConfigured
              - Sid: RunStackSharePointSecretRead
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref pSharePointAppSecretArn
              - !Ref AWS::NoValue
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'
        - Version: '2012-10-17'
          Statement:
            - Sid: RunStackUIPermissions
              Effect: Allow
              Action:
                - ssm:ListDocuments
                - ssm:DescribeDocument
                - ssm:GetDocument
                - events:ListRules
                - events:ListTargetsByRule
                - events:PutRule
                - events:PutTargets
                - events:DeleteRule
                - events:RemoveTargets
                - events:DescribeRule
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: '*'
        - Version: '2012-10-17'
          Statement:
            - Sid: RunStackAssessPermissions
              Effect: Allow
              Action:
                - ssm:SendCommand
                - ssm:GetCommandInvocation
                - ssm:ListCommandInvocations
              Resource: '*'
        - Version: '2012-10-17'
          Statement:
            - Sid: RunStackCrossAccountAssess
              Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub 'arn:aws:iam::*:role/${pCrossAccountRoleName}'
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt rCsaNotificationQueue.Arn
        - Version: '2012-10-17'
          Statement:
            - Sid: RunStackUploadsPermissions
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub '${rCsaSchedulerBucket.Arn}/uploads/*'
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt rCsaSchedulerBucket.Arn
              Condition:
                StringLike:
                  's3:prefix': 'uploads/*'
        - Version: '2012-10-17'
          Statement:
            - Sid: RunStackUserRoleManagement
              Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !GetAtt rCsaCognitoUserPool.Arn
        - Version: '2012-10-17'
          Statement:
            - Sid: RunStackDynatraceFetchTokenRead
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If [cCreateDynatraceFetchSecret, !Ref rDynatraceFetchApiToken, !Ref pExistingDynatraceFetchSecretArn]
            - Sid: RunStackDynatraceTriggerTokenRead
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If [cCreateDynatraceTriggerSecret, !Ref rDynatraceTriggerApiToken, !Ref pExistingDynatraceTriggerSecretArn]
            - Sid: RunStackDynatraceSyntheticFetchTokenRead
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If [cCreateDynatraceSyntheticFetchSecret, !Ref rDynatraceSyntheticFetchApiToken, !Ref pExistingDynatraceSyntheticFetchSecretArn]
            - Sid: RunStackDynatraceCatalogRead
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub '${rCsaSchedulerBucket.Arn}/app-catalogs/*'
            - Sid: RunStackDrTestSqlCredentialsRead
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If [cCreateDrTestSqlCredentialsSecret, !Ref rDrTestSqlCredentials, !Ref pExistingDrTestSqlCredentialsSecretArn]
            - Sid: RunStackTeamsApproveSharedSecretRead
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If [cCreateTeamsApproveSharedSecret, !Ref rTeamsApproveSharedSecret, !Ref pExistingTeamsApproveSharedSecretArn]
            - Sid: RunStackTeamsDrApprovalWebhookUrlRead
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If [cCreateTeamsDrApprovalWebhookUrlSecret, !Ref rTeamsDrApprovalWebhookUrl, !Ref pExistingTeamsDrApprovalWebhookUrlSecretArn]

  # Lambda function to process DynamoDB streams
  rCsaProcessJobs:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: The solution requires a static name for this resource
          - id: W11
            reason: This role needs to be able to access any resource
    Properties:
      FunctionName: !Sub '${pSolutionName}-process-jobs'
      CodeUri: src/process_jobs/
      Handler: app.lambda_handler
      ReservedConcurrentExecutions: !Ref pLambdaConcurrency
      VpcConfig:
        SecurityGroupIds:
          - !Ref pExistingLambdaSecurityGroupId
        SubnetIds: !Ref pPrivateSubnetIds
      Environment:
        Variables:
          STEP_FUNCTION_ARN: !Ref rCsaWorkflow
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt rCsaJobsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            ParallelizationFactor: 2
            MaximumRetryAttempts: 3
            BisectBatchOnFunctionError: true
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
                - ec2:AssignPrivateIpAddresses
                - ec2:UnassignPrivateIpAddresses
              Resource: '*'
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref rCsaWorkflow
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'

  # S3 Bucket for scheduler instance lists and SSM outputs
  rCsaSchedulerBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${pSolutionName}-job-scheduler-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  # S3 Bucket Policy to allow cross-account SSM to write outputs
  #rCsaSchedulerBucketPolicy:
  #  Type: AWS::S3::BucketPolicy
  #  Properties:
  #    Bucket: !Ref rCsaSchedulerBucket
  #    PolicyDocument:
  #      Version: '2012-10-17'
  #      Statement:
  #        - Sid: AllowCrossAccountSSMOutputs
  #          Effect: Allow
  #          Principal:
  #            AWS: !Sub 'arn:aws:iam::*:role/${pCrossAccountRoleName}'
  #          Action:
  #            - s3:PutObject
  #            - s3:PutObjectAcl
  #            - s3:GetObject
  #          Resource: !Sub '${rCsaSchedulerBucket.Arn}/ssm-outputs/*'
  #        - Sid: AllowCrossAccountBucketAccess
  #          Effect: Allow
  #          Principal:
  #            AWS: !Sub 'arn:aws:iam::*:role/${pCrossAccountRoleName}'
  #          Action:
  #            - s3:GetBucketLocation
  #            - s3:ListBucket
  #          Resource: !GetAtt rCsaSchedulerBucket.Arn

  # Lambda function for scheduled automation
  rCsaJobScheduler:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: The solution requires a static name for this resource
    Properties:
      FunctionName: !Sub '${pSolutionName}-job-scheduler'
      CodeUri: src/scheduler/
      Handler: app.lambda_handler
      ReservedConcurrentExecutions: !Ref pLambdaConcurrency
      VpcConfig:
        SecurityGroupIds:
          - !Ref pExistingLambdaSecurityGroupId
        SubnetIds: !Ref pPrivateSubnetIds
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref rCsaNotificationQueue
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
                - ec2:AssignPrivateIpAddresses
                - ec2:UnassignPrivateIpAddresses
              Resource: '*'
        - S3ReadPolicy:
            BucketName: !Ref rCsaSchedulerBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt rCsaNotificationQueue.QueueName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'

  # IAM Role for Step Function
  rCsaWorkflowRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: This role needs to be able to access any resource for cross-account operations
          - id: W28
            reason: The solution requires a static name for this resource
    Properties:
      RoleName: !Sub '${pSolutionName}-workflow-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: workflow-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt rCsaJobsTable.Arn
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: !Sub 'arn:aws:iam::*:role/${pCrossAccountRoleName}'
              - Effect: Allow
                Action:
                  - ssm:StartAutomationExecution
                  - ssm:SendCommand
                  - ssm:Get*
                  - ssm:Describe*
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref rCsaNotificationTopic

  # Secrets Manager secrets holding the two Dynatrace API tokens used by the
  # /synthetic/execute and /synthetic/{jobId} endpoints — Dynatrace commonly
  # scopes a read-only token (fetch monitors) separately from a token that
  # can trigger executions. Each is only created when its corresponding
  # pExistingDynatrace*SecretArn param is blank. Initial values are
  # placeholders — after deploy, update them with:
  #   aws secretsmanager put-secret-value --secret-id <name> --secret-string '<token>'
  rDynatraceFetchApiToken:
    Type: AWS::SecretsManager::Secret
    Condition: cCreateDynatraceFetchSecret
    Properties:
      Name: !Sub '${pSolutionName}-dynatrace-fetch-api-token'
      Description: Dynatrace API token (Api-Token auth) used to fetch/resolve synthetic monitors
      SecretString: 'REPLACE_ME_AFTER_DEPLOY'

  rDynatraceTriggerApiToken:
    Type: AWS::SecretsManager::Secret
    Condition: cCreateDynatraceTriggerSecret
    Properties:
      Name: !Sub '${pSolutionName}-dynatrace-trigger-api-token'
      Description: Dynatrace API token (Api-Token auth) used to trigger synthetic monitor executions and poll status
      SecretString: 'REPLACE_ME_AFTER_DEPLOY'

  rDynatraceSyntheticFetchApiToken:
    Type: AWS::SecretsManager::Secret
    Condition: cCreateDynatraceSyntheticFetchSecret
    Properties:
      Name: !Sub '${pSolutionName}-dynatrace-synthetic-fetch-api-token'
      Description: Dynatrace API token (Api-Token auth) used to fetch/resolve synthetic monitors specifically
      SecretString: 'REPLACE_ME_AFTER_DEPLOY'

  # DR test SQL credentials + Teams approval secrets — same
  # create-unless-existing-ARN-supplied pattern as the Dynatrace tokens
  # above. Initial values are placeholders — after deploy, update with:
  #   aws secretsmanager put-secret-value --secret-id <name> --secret-string '<value>'
  rDrTestSqlCredentials:
    Type: AWS::SecretsManager::Secret
    Condition: cCreateDrTestSqlCredentialsSecret
    Properties:
      Name: !Sub '${pSolutionName}-dr-test-sql-credentials'
      Description: JSON {"username":"...","password":"..."} for the DR failover test SQL account
      SecretString: '{"username":"REPLACE_ME_AFTER_DEPLOY","password":"REPLACE_ME_AFTER_DEPLOY"}'

  rTeamsApproveSharedSecret:
    Type: AWS::SecretsManager::Secret
    Condition: cCreateTeamsApproveSharedSecret
    Properties:
      Name: !Sub '${pSolutionName}-teams-approve-shared-secret'
      Description: Shared secret checked on the unauthenticated /dr-failover/{AGName}/approve Teams webhook
      SecretString: 'REPLACE_ME_AFTER_DEPLOY'

  rTeamsDrApprovalWebhookUrl:
    Type: AWS::SecretsManager::Secret
    Condition: cCreateTeamsDrApprovalWebhookUrlSecret
    Properties:
      Name: !Sub '${pSolutionName}-teams-dr-approval-webhook-url'
      Description: Power Automate webhook URL (contains embedded auth signature) for posting the DR approval Teams card
      SecretString: 'REPLACE_ME_AFTER_DEPLOY'

  # Step Function State Machine
  rCsaWorkflow:
    Type: AWS::Serverless::StateMachine
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: The solution requires a static name for this resource
    Properties:
      Name: !Sub '${pSolutionName}-workflow'
      DefinitionUri: src/step_function/workflow.asl.json
      DefinitionSubstitutions:
        CrossAccountRoleName: !Ref pCrossAccountRoleName
        JobsTableName: !Ref rCsaJobsTable
        MaxRetryAttempts: !Ref pMaxRetryAttempts
        MaxWaitTimeSeconds: !Ref pMaxWaitTimeSeconds
        NotificationTopicArn: !Ref rCsaNotificationTopic
      Role: !GetAtt rCsaWorkflowRole.Arn

  # CloudWatch Alarm for API Gateway Throttling
  rCsaApiThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: The solution requires a static name for this resource
    Properties:
      AlarmName: !Sub '${pSolutionName}-api-throttle-alarm'
      AlarmDescription: 'Alarm for API Gateway throttling events'
      MetricName: 4XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref rCsaApi
        - Name: Stage
          Value: !Ref pStage
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref rCsaNotificationTopic

  # CloudWatch Alarm for Lambda Concurrent Executions
  rCsaLambdaConcurrencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: The solution requires a static name for this resource
    Properties:
      AlarmName: !Sub '${pSolutionName}-lambda-concurrency-alarm'
      AlarmDescription: 'Alarm for Lambda concurrent executions approaching limit'
      MetricName: ConcurrentExecutions
      Namespace: AWS/Lambda
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref pLambdaConcurrency
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref rCsaNotificationTopic


  # ── App Access Table ─────────────────────────────────────────────────────────
  rCsaAppAccessTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: runstack-app-access
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_email
          AttributeType: S
        - AttributeName: app_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_email
          KeyType: HASH
        - AttributeName: app_id
          KeyType: RANGE
      Tags:
        - Key: Solution
          Value: !Ref pSolutionName

  # Split from runstack-app-access: that table is scoping-only (which apps a
  # user can see). This table is role-only (admin/operator/viewer) — one row
  # per person, eliminating the "which row do I set role on" ambiguity that
  # came from storing a global property per-app-row.
  rCsaUserRolesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: runstack-user-roles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_email
          AttributeType: S
      KeySchema:
        - AttributeName: user_email
          KeyType: HASH
      Tags:
        - Key: Solution
          Value: !Ref pSolutionName

  # ── UI Local Login Table ──────────────────────────────────────────────────────
  # Separate from runstack-user-roles / Cognito — used only so the React UI
  # can identify the person at the browser for button-level role gating in
  # the UI itself (Admin/Operator/Viewer). Does not affect AzureAD, the
  # agent, or any machine-token (Dynatrace/EventBridge) flows.
  rCsaUiLoginsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: runstack-ui-logins
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      Tags:
        - Key: Solution
          Value: !Ref pSolutionName

  # ── Instance Catalog Table ────────────────────────────────────────────────────
  # Recreated under IaC — was manually created, ITG test data only,
  # confirmed safe to delete-and-recreate (not production yet). Delete the
  # manual table/API resources BEFORE deploying this template.
  # Schema confirmed via live scan: AppId (S, HASH only, no sort key/GSI),
  # ApplicationName (S), Enabled (BOOL), Agents (L of M: Selection (S), AgentName (S)),
  # LastUpdated (S).
  rCsaTidalAgentMappingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: runstack-tidal-agent-mapping
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: AppId
          AttributeType: S
      KeySchema:
        - AttributeName: AppId
          KeyType: HASH
      Tags:
        - Key: Solution
          Value: !Ref pSolutionName

  # NOTE: The original rCsaDrConfigTable (per-AG instance identity + thresholds)
  # was removed. Instance identity (which host is currently Primary/DR replica)
  # is now derived live from the Dynatrace + SQL role query every time — a
  # static "east/west" config went stale the moment a failover happened, since
  # roles flip. Thresholds are the same across all AGs (see pDrMaxLogQueueKB
  # etc. below), so they're deploy-time parameters, not per-AG DynamoDB rows.

  # ── DR Run Log Table (plan/execute history, queryable by AG) ──────────────────
  rCsaDrRunLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: runstack-dr-run-log
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
        - AttributeName: ag_name
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ag_name-created_at-index
          KeySchema:
            - AttributeName: ag_name
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Solution
          Value: !Ref pSolutionName

  # ── DR Confirmation Tokens (short-lived, TTL-expiring, plan→execute gate) ──────
  rCsaDrTokensTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: runstack-dr-confirmation-tokens
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Solution
          Value: !Ref pSolutionName

  # ── GDBA Team Access (capability → scope, single-team table) ──────────────────
  # PK = capability only (not team_name + capability) — this table is
  # deliberately scoped to one team. Reusable for any future GDBA activity,
  # not just DR: add a new capability row, no schema change. `scope` is
  # either the string "ALL" or a list of resource IDs (AG names today;
  # instance IDs, app_ids, etc. for future capabilities — the check code
  # decides what the ID means, not the table).
  rCsaGdbaAccessTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: runstack-gdba-access
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: capability
          AttributeType: S
      KeySchema:
        - AttributeName: capability
          KeyType: HASH
      Tags:
        - Key: Solution
          Value: !Ref pSolutionName

  # ── Team Capabilities (generic multi-team access, PK=team, SK=capability) ─────
  # Generalized successor to rCsaGdbaAccessTable. One row per (team, capability):
  #   enabled  - bool, whether the capability is currently switched on
  #   scope    - "ALL" or a list of resource IDs the capability applies to
  #   updated_by / updated_at - audit fields
  # A reserved capability value "_meta" holds team-level config on a separate
  # item: { team, capability: "_meta", cognito_group, description }. This lets
  # new teams/capabilities be onboarded by adding rows only — no template or
  # Lambda env var changes required. rCsaGdbaAccessTable is left untouched;
  # existing GDBA checks keep reading it as-is.
  rCsaTeamCapabilitiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: runstack-team-capabilities
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: team
          AttributeType: S
        - AttributeName: capability
          AttributeType: S
      KeySchema:
        - AttributeName: team
          KeyType: HASH
        - AttributeName: capability
          KeyType: RANGE
      Tags:
        - Key: Solution
          Value: !Ref pSolutionName

  rCsaInstanceCatalogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: runstack-instance-catalog
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: instance_id
          AttributeType: S
        - AttributeName: app_id
          AttributeType: S
      KeySchema:
        - AttributeName: instance_id
          KeyType: HASH
        - AttributeName: app_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: app_id-index
          KeySchema:
            - AttributeName: app_id
              KeyType: HASH
            - AttributeName: instance_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Solution
          Value: !Ref pSolutionName

  # ── Catalog Sync Lambda ───────────────────────────────────────────────────────
  rCsaCatalogSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${pSolutionName}-catalog-sync'
      CodeUri: src/catalog_sync/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          INSTANCE_CATALOG_TABLE: !Ref rCsaInstanceCatalogTable
          CATALOG_S3_BUCKET: !Sub '${pSolutionName}-job-scheduler-${AWS::AccountId}-${AWS::Region}'
          CATALOG_S3_KEY: app-catalogs/instance-catalog.csv
          LOG_LEVEL: INFO
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref rCsaInstanceCatalogTable
        - S3ReadPolicy:
            BucketName: !Sub '${pSolutionName}-job-scheduler-${AWS::AccountId}-${AWS::Region}'
      Tags:
        Solution: !Ref pSolutionName

  # ── Catalog Sync Schedule ─────────────────────────────────────────────────────
  rCsaCatalogSyncSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${pSolutionName}-catalog-sync-schedule'
      Description: Daily sync of instance catalog from S3 to DynamoDB
      ScheduleExpression: cron(0 1 * * ? *)
      State: ENABLED
      Targets:
        - Id: CatalogSyncTarget
          Arn: !GetAtt rCsaCatalogSyncFunction.Arn

  rCsaCatalogSyncPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt rCsaCatalogSyncFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt rCsaCatalogSyncSchedule.Arn

  # ── API Gateway - GET /app-instances ───────────────────────────────────────────
  rCsaApiGetAppInstancesMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref rCsaApi
      ResourceId: !Ref rCsaApiAppInstancesResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref rCsaApiAuthorizer
      AuthorizationScopes:
        - !Sub '${pSolutionName}-api/notify'
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${rCsaProcessMessages.Arn}/invocations'
      MethodResponses:
        - StatusCode: '200'
        - StatusCode: '403'
        - StatusCode: '500'