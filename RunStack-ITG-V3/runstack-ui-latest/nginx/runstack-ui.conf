# nginx/runstack-ui.conf
# Place this file at: /etc/nginx/sites-available/runstack-ui
# Then: sudo ln -s /etc/nginx/sites-available/runstack-ui /etc/nginx/sites-enabled/
# And:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;              # Replace with your EC2 hostname or IP if desired

    root /var/www/runstack-ui;  # Where the React build output lives
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Cache static assets aggressively (React build hashes filenames)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # All other routes → React SPA (handles react-router client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Optional: restrict to internal IPs only (recommended for ops tooling)
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # deny all;
}
